<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>App review</title>
    <style>
        :root { color-scheme: light dark; font: 16px/1.5 system-ui,sans-serif; }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
        #handoff-status { position: fixed; z-index: 1; inset: auto .5rem .5rem; margin: 0; padding: .75rem; background: Canvas; color: CanvasText; border: 1px solid GrayText; border-radius: .5rem; }
        #app-review { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: Canvas; }
        [hidden] { display: none !important; }
    </style>
</head>
<body data-native-app-handoff="true">
    <p id="handoff-status" role="status" aria-live="polite">Opening the app…</p>
    <iframe id="app-review" title="App review" hidden></iframe>
    <script src="/handoff.js" defer></script>
</body>
</html>
