<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Connect app</title>
        <style>
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                font:
                    16px system-ui,
                    sans-serif;
            }
            #setup-status {
                padding: 24px;
            }
            iframe {
                display: block;
                border: 0;
                width: 100%;
                height: 100dvh;
            }
            iframe[hidden] {
                display: none;
            }
        </style>
    </head>
    <body data-local-app-setup="true" data-app-origin="">
        <p id="setup-status" role="status">Opening app…</p>
        <iframe
            id="app-frame"
            title="Connect app"
            hidden
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"
            referrerpolicy="no-referrer"
        ></iframe>
        <script src="/local-app-setup.js" defer></script>
    </body>
</html>
