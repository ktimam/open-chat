[package]
name = "openchat-fork-app-registry"
version = "0.1.0"
edition = "2021"
publish = false

# Deliberately independent of OpenChat's backend workspace and Cargo.lock.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candid = "=0.10.37"
hex = "=0.4.3"
ic-cdk = "=0.20.3"
ic-http-certification = { git = "https://github.com/dfinity/response-verification", rev = "85dd37f54b882dc5c490a02f467023470ac6faf4" }
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
url = "=2.5.8"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
