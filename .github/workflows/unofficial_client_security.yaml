name: Unofficial client security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-security:
    name: Dependency delta, advisories and licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up exact supported Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact frontend lockfile
        working-directory: frontend
        env:
          ONNXRUNTIME_NODE_INSTALL: "skip"
        run: npm ci --no-audit
      - name: Verify portable digest migration against reviewed history
        run: node --test scripts/security_dependency_hash.test.mjs
      - name: Check scoped candidate source and config formatting
        working-directory: .
        # Check the complete fork delta against the reviewed integrated upstream.
        # A push/PR base can include upstream-only formatting or omit older fork edits.
        env:
          PR_BASE_SHA: 5ca61b627809807b5c29300a46d539567249f1cd
        run: node scripts/check_current_client_format.mjs --scope current-client
      - name: Test current-client security contracts offline
        working-directory: .
        run: node --test scripts/npm_feature_scope.test.mjs scripts/npm_feature_seed_review.test.mjs scripts/npm_feature_advisories.test.mjs scripts/npm_feature_advisories.review.test.mjs scripts/npm_feature_runtime.test.mjs scripts/rust_feature_scope.test.mjs scripts/rust_feature_seed_review.test.mjs scripts/rust_feature_advisories.test.mjs scripts/rust_feature_advisory_results.test.mjs scripts/rust_feature_advisory_runner.test.mjs scripts/rust_feature_sbom.test.mjs scripts/rust_feature_sbom_validate.test.mjs scripts/rust_feature_collection.test.mjs scripts/rust_feature_ci.test.mjs scripts/check_feature_ci.test.mjs scripts/security_mode_scope.test.mjs scripts/security_owned_rules.test.mjs scripts/check_feature_ci.current-client.test.mjs scripts/check_current_client_licenses.test.mjs scripts/frontend_format_current.test.mjs
      - name: Check current-client security workflow wiring
        working-directory: .
        run: node scripts/check_feature_ci.mjs current-client-security
      - name: Validate the actual collector runtime offline before advisory requests
        id: scope_validated
        working-directory: .
        run: |
          set -euo pipefail
          npm_root="$(npm root --global)"
          node scripts/npm_feature_runtime_smoke.mjs --repository-root "$GITHUB_WORKSPACE" --scope current-client --arborist-path "$npm_root/npm/node_modules/@npmcli/arborist" --output-directory "$RUNNER_TEMP" --mode plan
      - name: Query advisories only for reviewed model and app-card dependency roots
        working-directory: .
        # The exact reviewed Node/npm tuple and Arborist source hashes are verified.
        # Source, seeds, install mode and lock identities are checked before/after.
        run: |
          set -euo pipefail
          npm_root="$(npm root --global)"
          node scripts/npm_feature_advisories.mjs --repository-root "$GITHUB_WORKSPACE" --scope current-client --arborist-path "$npm_root/npm/node_modules/@npmcli/arborist" --output-directory "$RUNNER_TEMP" --mode query-bulk
      - name: Upload scoped model and app npm evidence, including failed checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openchat-current-client-scoped-npm-report
          path: ${{ runner.temp }}/npm-feature-advisories-*
          if-no-files-found: error
      - name: Prepare locked Rust metadata inputs explicitly
        id: rust_inputs
        # An npm finding must not suppress independent Rust evidence. All earlier
        # source/scope/runtime checks must still pass; cancellation stops work.
        if: ${{ !cancelled() && steps.scope_validated.outcome == 'success' }}
        working-directory: .
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          cargo_path="$(rustup which --toolchain 1.95.0 cargo)"
          rustc_path="$(rustup which --toolchain 1.95.0 rustc)"
          RUSTC="$rustc_path" "$cargo_path" fetch --locked
      - name: Check current-client direct and model dependency licenses offline
        id: rust_licenses
        if: ${{ !cancelled() && steps.rust_inputs.outcome == 'success' }}
        working-directory: .
        # Fails closed if locked Cargo metadata is not already cached.
        run: |
          set -euo pipefail
          cargo_path="$(rustup which --toolchain 1.95.0 cargo)"
          node scripts/check_current_client_licenses.mjs --scope current-client --cargo-executable "$cargo_path"
      - name: Run scoped Rust collection, schema and advisory gate
        if: ${{ !cancelled() && steps.rust_licenses.outcome == 'success' }}
        working-directory: .
        # Incomplete source review stops before advisory egress; no broad fallback.
        run: |
          set -euo pipefail
          cargo_path="$(rustup which --toolchain 1.95.0 cargo)"
          config_sha256="$(sha256sum scripts/rust_feature_scope.current-client.json)"
          config_sha256="${config_sha256%% *}"
          node scripts/rust_feature_ci.mjs --repository-root "$GITHUB_WORKSPACE" --scope current-client --config-sha256 "$config_sha256" --output-directory "$RUNNER_TEMP" --cargo-executable "$cargo_path" --mode check-scoped
      - name: Upload scoped Rust evidence, including failed checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openchat-current-client-scoped-rust-report
          path: |
            ${{ runner.temp }}/rust-feature-ci-*/summary.json
            ${{ runner.temp }}/rust-feature-ci-*/rust-feature-collection-*/summary.json
            ${{ runner.temp }}/rust-feature-ci-*/rust-feature-collection-*/collection.json
            ${{ runner.temp }}/rust-feature-ci-*/rust-feature-collection-*/*.selected.json
            ${{ runner.temp }}/rust-feature-ci-*/rust-feature-collection-*/selected-rust.cdx*.json
            ${{ runner.temp }}/rust-feature-ci-*/rust-feature-advisories-*/*
          if-no-files-found: error

  android-component-contracts:
    name: Android component identity host contracts and SDK compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.1"
      - name: Test the pinned tool resolver and CI coverage offline
        run: node --test scripts/android_component_identity_tools.test.mjs scripts/model_ci_coverage.test.mjs
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install the Android API used by the component contracts
        run: sdkmanager "platforms;android-36"
      - name: Compile actual component sources and run host and SDK contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolsJson = & node scripts/android_component_identity_tools.mjs --output-directory "$env:RUNNER_TEMP/openchat-component-tools"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned component test tool resolution failed.' }
          $tools = $toolsJson | ConvertFrom-Json
          & ./frontend/tauri-plugin-oc/android/component-identity-tests/run.ps1 `
            -JavaHome $env:JAVA_HOME `
            -KotlinCompilerClasspath $tools.compilerClasspath `
            -KotlinRuntimeClasspath $tools.runtimeClasspath `
            -JUnitClasspath $tools.junitClasspath `
            -AndroidJar "$env:ANDROID_HOME/platforms/android-36/android.jar" `
            -OutputDirectory "$env:RUNNER_TEMP/openchat-component-classes"
          if ($LASTEXITCODE -ne 0) { throw 'Component identity contracts failed.' }
        # Host recording doubles plus real Android API compilation, not device
        # notification/authentication or APK/signing evidence. No Tauri init.

  native-hermetic:
    name: Native hermetic tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux desktop build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf libclang-dev cmake
      - name: Run downloader, store and boundary unit tests
        run: cargo test --locked -p tauri-plugin-oc --lib
      - name: Compile both shipping app feature sets (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo check --locked -p open-chat --features inference
          cargo check --locked -p open-chat --features inference,store
      - name: Compile both shipping app feature sets (Windows)
        if: runner.os == 'Windows'
        env:
          CMAKE_GENERATOR: Visual Studio 17 2022
        run: |
          cargo check --locked -p open-chat --features inference
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --locked -p open-chat --features inference,store
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  frontend-contracts:
    name: Frontend model contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact frontend lockfile
        working-directory: frontend
        env:
          ONNXRUNTIME_NODE_INSTALL: "skip"
        run: npm ci --no-audit
      - name: Run all local-model frontend contracts
        working-directory: frontend
        # Vitest uses literal path filters, not shell globs. Prefixes also select
        # Gemma/audio/lifecycle/build variants and future suites in these families.
        run: >-
          npm test --
          app/rollup-plugin-wasm-url
          app/src/publicKeyBuild
          app/src/stores/customModels
          app/src/stores/onDeviceModels
          app/src/stores/transformersWebGpu
          app/src/components_shared/WebInferenceRuntimeSettings
          app/src/components_shared/WebGpuModelCatalog
          app/src/utils/localAi
          app/src/utils/localAudioInput
          app/src/utils/configuredLocalBlobUrl
          app/src/utils/localImageInput
          app/src/utils/inferenceImage
          app/src/utils/model
          app/src/utils/onDeviceInference
          app/src/utils/nativeInferenceRuntimeBridge
          app/src/utils/imageDimensions
          app/src/utils/webInference
          app/src/utils/webGpuModelCatalog
          app/src/utils/transformersWebGpu
          app/src/utils/gemma4WebGpu
          app/src/bootstrapSecurity
          openchat-agent/src/services/storageBucket/publicBlob

  real-text-inference:
    name: Real inference with pinned 14 MB fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux desktop and llama.cpp prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf libclang-dev cmake
      - name: Download and verify immutable MIT-licensed GGUF fixture
        env:
          MODEL_SHA256: a439d0bbdce924ff1a32f68b7b2dd7fa0b98687f7eb6e7e55206527b446362af
          MODEL_URL: https://huggingface.co/tensorblock/tinyllama-15M-stories-GGUF/resolve/227c5a5ad3c1a830901543cf9959c53572014a68/tinyllama-15M-stories-Q4_0.gguf
        run: |
          mkdir -p "$RUNNER_TEMP/openchat-model-fixture"
          model_path="$RUNNER_TEMP/openchat-model-fixture/tinyllama-15M-stories-Q4_0.gguf"
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --max-filesize 13893600 "$MODEL_URL" --output "$model_path"
          echo "$MODEL_SHA256  $model_path" | sha256sum --check --strict
          test "$(stat --format=%s "$model_path")" = "13893600"
          echo "OC_TEST_MODEL_GGUF=$model_path" >> "$GITHUB_ENV"
      - name: Run an actual inference (ignored tests must be selected explicitly)
        run: >-
          cargo test --locked -p tauri-plugin-oc --features inference
          inference::tests::text_inference_smoke --
          --ignored --exact --nocapture
