# `merge_group` runs these checks on the merge queue's temporary branches. Without it a PR added
# to the queue would sit with its required checks pending and never merge.
on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  merge_group:
    branches:
      - master
      - main

name: Frontend linting, type check & unit tests

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The lint/type check/test job and the production build job run on separate runners because they
# are independent and each takes minutes, so running them one after another (or concurrently on
# one 4-core runner, where they contend for CPU) roughly doubles the wall-clock time.
# `install-and-test` at the bottom is the required status check; it gates on both.
jobs:
  # Backend-only PRs have nothing here to check. `install-and-test` is a required status check,
  # so it must still run on every PR (a workflow-level `paths:` filter would leave the check
  # pending and the PR unmergeable); instead the jobs skip themselves when nothing they depend on
  # changed, and the gate passes. This mirrors the `changes` job in backend.yaml.
  changes:
    name: detect frontend changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - "frontend/**"
              - "scripts/android_startup_order.test.mjs"
              - "scripts/build-unofficial-local-apk.test.mjs"
              - ".prettierignore"
              - ".github/workflows/**"

  checks:
    name: lint, type check and test
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"
          # The npm cache is populated on pushes to master (frontend_cache.yaml)
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL: "skip"
        run: npm ci --no-audit

        # Do not rewrite the lockfile while verifying a release candidate.
      - name: Verify locked Rollup Linux Binary
        run: node -e "require('@rollup/rollup-linux-x64-gnu')"

      - name: Lint, type check and test
        run: npm run check:ci
        env:
          NODE_ENV: ci
          OC_USERGEEK_APIKEY: DUMMY_USERGEEK_APIKEY
          OC_ROLLBAR_ACCESS_TOKEN: DUMMY_ROLLBAR_ACCESS_TOKEN
          OC_WEBSITE_VERSION: 1.0.0
          OC_METERED_APIKEY: DUMMY_METERED_APIKEY
          OC_VAPID_PUBLIC_KEY: DUMMY_VAPID_PUBLIC_KEY

  build:
    name: production build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL: "skip"
        run: npm ci --no-audit

        # A missing platform package is a lockfile failure, not permission to rewrite it in CI.
      - name: Verify locked Rollup Linux Binary
        run: node -e "require('@rollup/rollup-linux-x64-gnu')"

      - name: Verify OTA archive prerequisites
        run: |
          command -v zip
          command -v unzip

      # Offline fixtures and source contracts only; no APK build, device, or network requests.
      - name: Check offline local APK startup and build contracts
        working-directory: .
        run: node --test scripts/android_startup_order.test.mjs scripts/build-unofficial-local-apk.test.mjs

      - name: Check PR and release policy regressions
        working-directory: .
        run: node --test scripts/pr-ci-policy.test.mjs scripts/app_model_integration.test.mjs scripts/message_content_candid_contract.test.mjs scripts/validate_action_inbox_wiring.test.mjs scripts/android_release_policy.test.mjs scripts/android_release_checks.test.mjs scripts/release_preflight.test.mjs scripts/upgrade_canister.test.mjs scripts/android_bundle.test.mjs scripts/android_build_prerequisites.test.mjs scripts/frontend_format_check.test.mjs scripts/frontend_format_inherited.test.mjs scripts/android_dev.test.mjs scripts/verify_webgpu_distribution.test.mjs scripts/model_asset_notices.test.mjs scripts/sbom_lock_identity.test.mjs scripts/model_ci_coverage.test.mjs scripts/security_mode_scope.test.mjs

      # Pure local fixtures only: no advisory requests, installs, or live model runs.
      - name: Check offline feature inventory and CI contracts
        working-directory: .
        run: node --test scripts/npm_feature_scope.test.mjs scripts/npm_feature_seed_review.test.mjs scripts/npm_feature_advisories.test.mjs scripts/npm_feature_advisories.review.test.mjs scripts/npm_feature_runtime.test.mjs scripts/rust_feature_scope.test.mjs scripts/rust_feature_seed_review.test.mjs scripts/rust_feature_advisories.test.mjs scripts/rust_feature_advisory_results.test.mjs scripts/rust_feature_advisory_runner.test.mjs scripts/rust_feature_sbom.test.mjs scripts/rust_feature_sbom_validate.test.mjs scripts/rust_feature_collection.test.mjs scripts/rust_feature_ci.test.mjs scripts/check_feature_ci.test.mjs scripts/security_mode_scope.test.mjs scripts/security_owned_rules.test.mjs

      - name: Verify narrowly scoped dependency compatibility
        working-directory: .
        run: |
          node scripts/cdp_axios_compatibility.mjs
          node scripts/decoder_compatibility.mjs
          node scripts/onnx_adm_zip_compatibility.mjs
          node scripts/transformers_sharp_compatibility.mjs

      - name: Install the repository-pinned dfx build prerequisite
        uses: dfinity/setup-dfx@e50c04f104ee4285ec010f10609483cf41e4d365
        with:
          dfx-version: "0.31.0-beta.1"

      - name: Verify dfx is available for the public-key query
        run: dfx --version

      - name: Build frontend
        run: npm run build:prod
        env:
          NODE_ENV: ci
          OC_USERGEEK_APIKEY: DUMMY_USERGEEK_APIKEY
          OC_ROLLBAR_ACCESS_TOKEN: DUMMY_ROLLBAR_ACCESS_TOKEN
          OC_WEBSITE_VERSION: 1.0.0
          OC_METERED_APIKEY: DUMMY_METERED_APIKEY
          OC_VAPID_PUBLIC_KEY: DUMMY_VAPID_PUBLIC_KEY

      # A candidate build proves immutable asset packaging, not deployment approval
      # or physical-device inference. The default production build stays separate.
      - name: Build and verify the opt-in production WebGPU candidate
        run: |
          npm run build:prod
          node ../scripts/verify_webgpu_distribution.mjs app/build
        env:
          NODE_ENV: ci
          OC_USERGEEK_APIKEY: DUMMY_USERGEEK_APIKEY
          OC_ROLLBAR_ACCESS_TOKEN: DUMMY_ROLLBAR_ACCESS_TOKEN
          OC_WEBSITE_VERSION: 1.0.0
          OC_METERED_APIKEY: DUMMY_METERED_APIKEY
          OC_VAPID_PUBLIC_KEY: DUMMY_VAPID_PUBLIC_KEY
          OC_TRANSFORMERS_WEBGPU_IMAGE_SPIKE: "true"
          OC_TRANSFORMERS_WEBGPU_ASSET_DELIVERY: immutable-hub-v1

      - name: Save dependencies to cache
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v3
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('frontend/package-lock.json') }}
  # The required status check. It runs even when the jobs above fail or are skipped (`always()`),
  # because a skipped job satisfies branch protection and this one must not be skipped just
  # because a check failed.
  install-and-test:
    needs: [changes, checks, build]
    if: always()
    runs-on: ubuntu-latest
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
      # Every job this one needs, so that a job added above is gated without touching this one
      ALL_RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - name: Check the results
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "The change detection job did not succeed ($CHANGES_RESULT)"
            exit 1
          fi
          if [ "$FRONTEND_CHANGED" != "true" ]; then
            echo "No frontend changes"
            exit 0
          fi
          for result in $ALL_RESULTS; do
            if [ "$result" != "success" ]; then
              echo "Not every job succeeded: $ALL_RESULTS"
              exit 1
            fi
          done
          echo "All jobs passed"
