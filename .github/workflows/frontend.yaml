on:
  pull_request:
    branches:
      - master
      - codex/pr1-local-models
  push:
    branches:
      - codex/pr1-local-models
      - codex/pr2-app-chat-interfaces
      - codex/pr2-clean-integration
  workflow_dispatch:

name: Frontend linting, type check & unit tests

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Restore dependencies from cache
        uses: actions/cache/restore@v3
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-

      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"

      - name: Install dependencies
        run: npm ci

        # A missing platform package is a lockfile failure, not permission to rewrite it in CI.
      - name: Verify locked Rollup Linux Binary
        run: node -e "require('@rollup/rollup-linux-x64-gnu')"

      - name: Check PR and release policy regressions
        working-directory: .
        run: node --test scripts/pr-ci-policy.test.mjs scripts/android_release_policy.test.mjs scripts/android_release_checks.test.mjs

      - name: Build frontend
        run: npm run build:ci
        env:
          NODE_ENV: ci
          OC_USERGEEK_APIKEY: DUMMY_USERGEEK_APIKEY
          OC_ROLLBAR_ACCESS_TOKEN: DUMMY_ROLLBAR_ACCESS_TOKEN
          OC_WEBSITE_VERSION: 1.0.0
          OC_METERED_APIKEY: DUMMY_METERED_APIKEY
          OC_VAPID_PUBLIC_KEY: DUMMY_VAPID_PUBLIC_KEY

      - name: Save dependencies to cache
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: actions/cache/save@v3
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('frontend/package-lock.json') }}
